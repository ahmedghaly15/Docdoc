name: docdoc
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  # Simple direct Service Locator that allows to access the concrete implementation from everywhere
  get_it: ^8.0.3
  # State management
  flutter_bloc: ^9.1.0
  # Code generator (mainly used with Cubit & retrofit)
  freezed_annotation: ^2.4.4
  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_annotation: ^4.9.0
  # Networking
  dio: ^5.3.4
  logger: ^2.5.0
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1
  # Localization
  intl: ^0.19.0
  easy_localization: ^3.0.3
  # For splash screen
  flutter_native_splash: ^2.3.9
  # An SVG rendering and widget library for Flutter, which allows painting
  flutter_svg: ^2.0.9
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models
  flutter_screenutil: ^5.9.0
  # Updating app's launcher icon
  flutter_launcher_icons: ^0.14.3
  # Flutter plugin for reading and writing simple key-value pairs for cache
  shared_preferences: ^2.0.20
  # Flutter library to load and cache network images.
  cached_network_image: ^3.3.1
  # Provides API to store data in secure storage
  flutter_secure_storage: ^9.2.2
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Recommended lints to encourage good coding practices
  flutter_lints: ^5.0.0
  # A build system for Dart code generation and modular compilation.
  build_runner:
  # Networking
  retrofit_generator: ^9.1.9
  # Code generator (mainly used with Bloc)
  freezed: ^2.5.7
  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_serializable: ^6.9.0
  # Code generation for riverpod
  riverpod_generator: ^2.4.4
  # Custom Lint rules are a powerful way to improve the maintainability of a project
  custom_lint:
  # A developer tool for users of Riverpod, designed to help stop common issues and simplify repetitive tasks.
  riverpod_lint: ^2.4.0



flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/svgs/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_assets:
  assets_path: assets/
  output_path: lib/src/core/utils/
  filename: app_assets.dart
  field_prefix: null
